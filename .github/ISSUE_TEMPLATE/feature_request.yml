name: Feature request
description: Suggest a change to what the tool shows or how it behaves
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is awkward today
      description: |
        Describe the situation you keep running into, not the solution. It is
        the part that decides whether a change is worth it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Including whether an existing setting almost does it.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be read from a provider's own API or the local logs, not estimated
        - label: I have checked the open issues for the same idea
